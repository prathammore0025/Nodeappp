apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "helm.fullname" . }}-mongo
  template:
    metadata:
      labels:
        app: {{ include "helm.fullname" . }}-mongo
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image }}"
          ports:
            - containerPort: {{ .Values.mongo.port }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.mongo.username | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: {{ .Values.mongo.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-mongo
spec:
  selector:
    app: {{ include "helm.fullname" . }}-mongo
  ports:
    - port: {{ .Values.mongo.port }}
      targetPort: {{ .Values.mongo.port }}

